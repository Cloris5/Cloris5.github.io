/* 几何合并兼容层(v6-slice-2 修复)

   这里在混合时把非索引件用 mergeVertices 转成索引几何,只保留共有属性,失败时给出可读报错。 */
function mergeG(list,tag){
  const anyIdx=list.some(g=>g.index),allIdx=list.every(g=>g.index);
  const gs=(anyIdx&&!allIdx)?list.map(g=>g.index?g:BGU.mergeVertices(g)):list;
  const names=Object.keys(gs[0].attributes).filter(n=>gs.every(g=>g.attributes[n]));
  for(const g of gs)for(const n of Object.keys(g.attributes))if(!names.includes(n))g.deleteAttribute(n);
  const out=BGU.mergeGeometries(gs);
  if(!out)throw new Error('几何合并失败'+(tag?': '+tag:'')+'(属性或索引不兼容)');
  return out;
}

let shaderCount=0;
function patchStd(mat,key,o){                    // 在内置 PBR 上注入世界坐标与噪声(石面、熏黑板甲)
  mat.onBeforeCompile=sh=>{
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;varying vec3 vWN;')
     .replace('#include <project_vertex>',`#include <project_vertex>
#ifdef USE_INSTANCING
 vWP=(modelMatrix*instanceMatrix*vec4(transformed,1.)).xyz; vWN=normalize(mat3(modelMatrix)*mat3(instanceMatrix)*objectNormal);
#else
 vWP=(modelMatrix*vec4(transformed,1.)).xyz; vWN=normalize(mat3(modelMatrix)*objectNormal);
#endif`);
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;varying vec3 vWN;\n'+GLSL_NOISE)
     .replace('#include <color_fragment>','#include <color_fragment>\n'+o.color)
     .replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\n'+(o.rough||''));
  };
  mat.customProgramCacheKey=()=>key; shaderCount++; return mat;
}

   float fzR=length(vWP.xz);float fzAng=atan(vWP.z,vWP.x);
   vec2 fzQ=fzA.y>.5?vec2(fzR*.42,fzAng*(floor(fzR*.42)+2.)*1.6):vec2(vWP.y*.55,fzAng*18.+floor(vWP.y*.55)*.5);

  T.seqScale=1;d.setup();CAM.snap=true;ANIM.snap=true;REC.chap=SEQ.shots.map(s=>s.t0.toFixed(2)+'s  '+s.n).join('\n');dirRefresh();

function seqUpdate(rdt){
  if(!SEQ.on||SEQ.paused)return; SEQ.t+=rdt*SEQ.speed;
  while(SEQ.on&&SEQ.ei<SEQ.evs.length&&SEQ.evs[SEQ.ei].t<=SEQ.t){const e=SEQ.evs[SEQ.ei++];e.f();}
  if(!SEQ.on)return;
  for(let i=0;i<SEQ.shots.length;i++){const s=SEQ.shots[i];if(SEQ.t>=s.t0&&SEQ.t<s.t1){s.f((SEQ.t-s.t0)/(s.t1-s.t0));if(SEQ.cut!==i){SEQ.cut=i;CAM.cineK=1;}break;}}
  if(SEQ.t>=SEQ.dur){const a=SEQ.after,nm=SEQ.name;if(SEQ.loop&&!a){seqPlay(nm);return;}seqStop(true);if(a)a();else if(REC.on&&REC.auto)recStop();else if(G.mode!=='play'||nm==='demo')toAttract();}
}
function seqSeek(t){const nm=SEQ.name||'hook',sp=SEQ.speed;seqPlay(nm,SEQ.after);SEQ.speed=1;T.ff=true;for(let i=0;i<t*30&&SEQ.on;i++)update(1/30);T.ff=false;SEQ.speed=sp;}

function recStart(tag,seqName){

    const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    REC.mr=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:20e6}:{videoBitsPerSecond:20e6});REC.chunks=[];REC.ext=mime.indexOf('mp4')>=0?'mp4':'webm';
    REC.mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data);};
    REC.mr.onstop=()=>{dl(new Blob(REC.chunks,{type:REC.mr.mimeType||'video/webm'}),ID+'-'+REC.tag+'.'+REC.ext);dl(new Blob([ID+' 章节时间表('+REC.tag+')\n'+(REC.chap||'0.00s 手动录制')],{type:'text/plain'}),ID+'-'+REC.tag+'-章节.txt');
      recLock=null;resize();recEl.style.display='none';if(REC.queue.length){const n=REC.queue.shift();setTimeout(()=>recStart(n[0],n[1]),600);}};
    REC.mr.start(200);REC.on=true;REC.auto=!!seqName;REC.cover=true;recEl.lastChild.textContent='REC '+REC.tag;
    if(seqName){if(seqName==='demo')G.mode='play';else if(G.mode!=='attract')G.mode='attract';seqPlay(seqName,null);}else REC.chap='';

  G.act=n;G.chapterT=0;G.tipI=0;G.actT=0;

  else if(n===2){G.chapter=['幕二 · 变','铸铁巨卫登场 —— 甲片烧红了才劈得动'];const a=Math.atan2(H.pos.z,H.pos.x);bossSpawn(a);
    G.cine={t:0,dur:1.5,f:u=>{const dx=Math.cos(a),dz=Math.sin(a);camSet(dx*(15-3*u)-dz*2.5,1.0+u*0.6,dz*(15-3*u)+dx*2.5,BOSS.pos.x,2.2+2*u,BOSS.pos.z,50);}};banner('铸铁巨卫');}

}
function onEnemyDown(){

  BOSS.alive=false;BOSS.state='dying';BOSS.t=0;BOSS.broken=0;BOSS.coreHp=0;G.spectacle=true;G.spectacleT=0;G.progress=1;H.lock=null;
  T.hitStop=Math.max(T.hitStop,0.14);T.slowT=0.4;G.impactT=0.09;trauma(0.9);AU.boom(1);AU.braam();AU.setTension(3);
  spawnDebris(BOSS.pos.x,3.6,BOSS.pos.z,40,9,1,1.6);FX.sparks(BOSS.pos.x,3.6,BOSS.pos.z,120,14,0,0.6,0,1,true);

function spectCam(t){   // 奇观的三镜:远景交代 → 主角近景反应 → 再拉远
  const hr=Math.hypot(H.rpos.x,H.rpos.z)||1,ox=H.rpos.x/hr,oz=H.rpos.z/hr;

function updateSpectacle(dt){   // 炉心碎裂 → 巨卫跪倒 → 铁水溢出流成纹章 → 烟被冲开 → 月光落下(一局只一次)

    if(t<2.2&&rnd()<0.7){const a=rr(0,6.283);FX.sparks(Math.cos(a)*5.6,0.5,Math.sin(a)*5.6,4,5,Math.cos(a)*0.6,0.8,Math.sin(a)*0.6,0.5,true);}}
  if(G.cine&&G.cine.spect){H.yaw+=angDiff(H.yaw,Math.atan2(-H.pos.x,-H.pos.z))*Math.min(1,dt*3);H.look.set(0,t>2.5?30:3,0);H.lookK=1;}
  if(t>7.4&&G.mode==='play'&&!G.epilogue&&!G.result)showResult();

function showResult(){

onAnyKey=code=>{

  else if(code==='KeyL'){P.low=!P.low;resize();sub(P.low?'低端模式:关体积光与景深、粒子减半、渲染比例 0.75':'低端模式关闭');}

};

    导入:()=>{const s=prompt('粘贴参数 JSON');if(!s)return;try{const o=JSON.parse(s);for(const d of DEFS)if(typeof o[d[0]]==='number')P[d[0]]=clamp(o[d[0]],d[2],d[3]);resize();sub('参数已导入');}catch(e){sub('JSON 无法解析');}},

  F['画面预设'].add(act,'随机').name('随机(带种子)');F['画面预设'].add(act,'重置');F['画面预设'].add(act,'导出').name('导出 JSON / 写入网址 ?p=');F['画面预设'].add(act,'导入').name('导入 JSON');

  F['镜头'].add(P,'invertY').name('反转 Y 轴');F['后期'].add(P,'mblur').name('动态模糊(甩镜)');
  F['性能'].add(P,'gtao').name('GTAO 环境光遮蔽').listen();F['性能'].add(P,'shadows').name('主光阴影');F['性能'].add(P,'low').name('低端模式(L)').listen().onChange(()=>resize());
  F['录制'].add(act,'录钩子').name('J · 一键录 10 秒钩子');F['录制'].add(act,'录制开关').name('K · 开始 / 停止录制');F['录制'].add(act,'导演台').name('O · 导演台');F['声音'].add(act,'静音').name('M · 静音开关');
  const pp=URLP.get('p');if(pp){try{const o=JSON.parse(atob(pp));for(const d of DEFS)if(typeof o[d[0]]==='number')P[d[0]]=clamp(o[d[0]],d[2],d[3]);}catch(e){log('?p= 无法还原');}}

function applyParams(rdt){

  gradeU.uTime.value=T.real;gradeU.uVig.value=P.uVignette;gradeU.uWarm.value=P.uWarm;gradeU.uSat.value=P.uSat;gradeU.uGrain.value=P.uGrain;gradeU.uCA.value=P.uCA;gradeU.uDof.value=P.low?0:P.uDof;

/* ===================== 16 主循环:输入 → 模拟(固定 1/120)→ 动画 → 镜头 → 渲染 ===================== */
const STEP=1/120; let acc=0,lastNow=0,lowT=0,autoLow=false,fatal=0;
function update(rdt){
  T.rdt=rdt;T.real+=rdt;T.frame++;
  if(keys.KeyR&&(G.mode==='play'||G.mode==='result')){G.rHold=(G.rHold||0)+rdt;if(G.rHold>0.9){G.rHold=0;keys.KeyR=false;seqStop();startGame(false);}}else G.rHold=0;
  if(REC.pending!==null){REC.warm-=rdt;if(REC.warm<=0)recBegin();}
  seqUpdate(rdt);
  const frozen=G.paused||G.photo; if(T.slowT>0){T.slowT-=rdt;T.scale=P.uSlowMo;}else T.scale=1;
  let gdt=frozen?0:rdt*T.scale*T.seqScale; if(T.hitStop>0){T.hitStop-=rdt;gdt=0;} T.dt=gdt;
  acc+=gdt; let n=0;
  while(acc>=STEP&&n<8){ if(AP.on)AP.update(STEP);else sampleHuman(); T.game+=STEP; playerStep(STEP); updateGolems(STEP); updateBoss(STEP); gameStep(STEP); clearEdges(); acc-=STEP; n++; }
  if(n>=8)acc=0; if(frozen)clearEdges();
  H.rpos.lerpVectors(H.prev,H.pos,clamp(acc/STEP,0,1));
  run('world',()=>updateWorld(gdt,rdt)); updateSpectacle(gdt);
  animHero(gdt); updateBladeTemp(gdt,PROX.heatK);
  if(gdt>0){run('cloth',()=>updateCloth(gdt));TRAIL.update(gdt,HERO.baseW,HERO.tipW,H.swing);}
  run('fx',()=>updateFx(gdt,rdt));
  if(G.cine){G.cine.t+=rdt;if(G.cine.spect)spectCam(G.cine.t);else G.cine.f(clamp(G.cine.t/G.cine.dur,0,1));if(G.cine.t>=G.cine.dur)G.cine=null;}
  updateCamera(rdt); applyParams(rdt); run('audio',()=>updateAudio(rdt));
  if(!T.ff&&(T.frame&1)===0)run('hud',drawHud);
  dirTick();
}
function render(){
  renderer.info.reset();
  if(!G.noPost){try{composer.render();}catch(e){log('后期出错: '+e.message);if(gtaoPass&&P.gtao){P.gtao=false;gtaoPass.enabled=false;}else if(smaaPass&&smaaPass.enabled)smaaPass.enabled=false;else G.noPost=true;}}
  if(G.noPost){renderer.setRenderTarget(null);renderer.render(scene,camera);}
  G.calls=renderer.info.render.calls;G.tris=renderer.info.render.triangles;
  run('hudRender',renderHud); recAfterRender();
}
function frame(now){
  requestAnimationFrame(frame);
  const rdt=Math.min(Math.max((now-lastNow)/1000,0.0001),1/20);lastNow=now;
  try{update(rdt);render();}catch(e){if(fatal++<1){showErr('运行时错误: '+(e&&e.stack||e));console.error(e);}}
  T.fps=lerp(T.fps,1/rdt,0.05);
  if(T.fps<45&&T.real>4&&!autoLow){lowT+=rdt;if(lowT>2){autoLow=true;P.uScale=0.75;P.gtao=false;resize();log('连续 2 秒低于 45fps:渲染比例降到 0.75 并关闭 GTAO');}}else lowT=0;
  if(dbgEl.style.display==='block'&&(T.frame%20)===0)dbgEl.textContent=ID+' 调试层\nfps '+T.fps.toFixed(0)+' · draw calls '+G.calls+' · 三角 '+G.tris+'\n模式 '+G.mode+' 幕 '+G.act+' 主角 '+H.state+' 剑温 '+P.uBladeTemp.toFixed(2)+
    '\n时间轴 '+(SEQ.on?SEQ.name+' '+SEQ.t.toFixed(1):'—')+' · 着色器 '+renderer.info.programs.length+'\n自检 '+JSON.stringify(G.selftest||{})+'\n'+dbgLines.join('\n');
}
window.SCENE_META={id:ID,hero:'炉卫骑士(桶盔 / 阔剑 / 防火皮裙)',verbs:['左键 · 挥斩','长按左键 · 蓄力下劈','右键 · 架挡','Shift · 翻滚','F · 淬火'],foes:['炉渣傀儡','锻锤机关','铸铁巨卫(三阶段)'],
 looks:'R12 暗黑哥特 · RenderPass→GTAO→Bloom→调色→SMAA→OutputPass',tunables:DEFS.map(d=>({name:d[1],uniform:d[0],min:d[2],max:d[3],def:d[4]})),
 proximity:['铁水槽','水槽','锻锤','风箱拉杆','巨卫红甲'],timeline:{hook:10,trailer:30,demo:60}};
window.__selftest=function(){
  const r={};

  r.相机不穿地=camera.position.y>0.2; r.互动点数=window.SCENE_META.proximity.length; r.shader程序=renderer.info.programs.length+'(材质 '+shaderCount+')'; r.shader报错=shaderErrs;
  r.音频总线=AU.ready?'就绪':'待首次点击'; r.时间轴=Object.keys(TIMELINES).filter(k=>k!=='turn').map(k=>k+':'+TIMELINES[k]().dur+'s').join(' ');
  r.主角=HERO.parts+' 部件 / '+BONE_DEF.length+' 骨'; G.selftest=r; console.info('[自检]',r); return r;
};
async function boot(){
  buildWorld();buildHero();buildGolems();buildBoss();dirBuild();buildGui();resize();
  for(let i=0;i<260;i++){const a=rr(0,6.283),r=rnd()<0.5?rr(0,5):rr(6,24);FX.embers(Math.cos(a)*r,rr(0.2,6),Math.sin(a)*r,1,0.5,5);}   // 粒子预滚
  attractLoop(); update(0.0001);
  try{await renderer.compileAsync(scene,camera);}catch(e){log('compileAsync 跳过: '+e.message);}
  window.__booted=true; window.__selftest(); lastNow=performance.now(); requestAnimationFrame(frame);
  const au=URLP.get('auto'); if(au){const nm={10:'hook',30:'trailer',60:'demo'}[au];if(nm){if(URLP.get('rec')==='1')recStart(nm==='hook'?'10秒钩子':(nm==='trailer'?'30秒预告':'60秒实机演示'),nm);else{G.mode=nm==='demo'?'play':'attract';seqPlay(nm,null);}}}
}
